name: Delta VPN Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test live traffic calculation
        run: bash scripts/test_traffic.sh
      - name: Get pinned upstream source
        uses: actions/checkout@v5
        with:
          repository: 2dust/v2rayNG
          ref: 57907cf354d9769200ed4717b4430d605abe0952
          path: upstream
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Native tunnel
        working-directory: upstream
        run: |
          sdkmanager --install 'ndk;30.0.16248370'
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/
      - name: Xray native library
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          mkdir -p V2rayNG/app/libs
          gh release download "$tag" -R 2dust/AndroidLibXrayLite -p libv2ray.aar -D V2rayNG/app/libs
      - name: Apply Delta overlay
        env:
          DELTA_APP_API_URL: ${{ vars.DELTA_APP_API_URL }}
        run: python3 scripts/prepare.py upstream
      - name: Resolve pinned Kotlin plugins directly
        working-directory: upstream/V2rayNG
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("settings.gradle.kts")
          src = path.read_text()
          anchor = "pluginManagement {\n"
          if src.count(anchor) != 1 or "resolutionStrategy {" in src:
              raise SystemExit("Unexpected upstream pluginManagement configuration")
          patch = '''    resolutionStrategy {
                  eachPlugin {
                      when (requested.id.id) {
                          "org.jetbrains.kotlin.android" ->
                              useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:$VER")
                          "org.jetbrains.kotlin.plugin.compose" ->
                              useModule("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$VER")
                      }
                  }
              }
          '''.replace("$VER", "$" + "{requested.version}")
          path.write_text(src.replace(anchor, anchor + patch, 1))
          print("PINNED_KOTLIN_PLUGIN_MODULES_CONFIGURED")
          PY
      - name: Verify Gradle configuration and resolve plugins
        working-directory: upstream/V2rayNG
        run: |
          set -euo pipefail
          chmod +x gradlew
          if ! ./gradlew --no-daemon --stacktrace help; then
            echo "::warning::Gradle configuration failed; retrying once with refreshed dependencies."
            sleep 10
            ./gradlew --no-daemon --refresh-dependencies --stacktrace help
          fi
      - name: Compile ARM64 unsigned release APK
        working-directory: upstream/V2rayNG
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleFdroidRelease -PABI_FILTERS=arm64-v8a
          mkdir -p "$GITHUB_WORKSPACE/output"
          mapfile -t apks < <(find app/build/outputs/apk/fdroid/release -name '*arm64-v8a*.apk')
          test "${#apks[@]}" = 1
          cp "${apks[0]}" "$GITHUB_WORKSPACE/output/DeltaVPN-unsigned.apk"
          test -s "$GITHUB_WORKSPACE/output/DeltaVPN-unsigned.apk"
      - name: Archive corresponding source
        run: |
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=local.properties -czf output/DeltaVPN-source.tar.gz -C upstream .
      - name: Upload unsigned release build
        uses: actions/upload-artifact@v4
        with:
          name: delta-unsigned-release
          path: output/
          if-no-files-found: error
  publish:
    needs: apk
    # Explicit owner-requested signed test release on the named main-branch merge.
    if: github.repository == 'deltashopsiavash/deltavpn' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release Delta VPN 1.7.7 signed test')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: delta-unsigned-release
          path: output
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'build-tools;37.0.0'
      - name: Sign and verify with permanent Delta certificate
        env:
          DELTA_KEYSTORE_B64: ${{ secrets.DELTA_KEYSTORE_B64 }}
          DELTA_KEYSTORE_PASSWORD: ${{ secrets.DELTA_KEYSTORE_PASSWORD }}
          DELTA_CERT_SHA256: ${{ vars.DELTA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          : "${DELTA_KEYSTORE_B64:?Missing permanent keystore}"
          : "${DELTA_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${DELTA_CERT_SHA256:?Missing pinned signing certificate fingerprint}"
          fail() { echo "::error::$1"; exit 1; }
          expected=$(printf '%s' "$DELTA_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || fail "Pinned certificate fingerprint is not 64 hexadecimal characters."
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$DELTA_KEYSTORE_B64" | base64 --decode > "$tmp/delta.p12" || fail "Invalid keystore encoding."
          unset DELTA_KEYSTORE_B64
          keytool -exportcert -keystore "$tmp/delta.p12" -storetype PKCS12 -alias delta-release -storepass:env DELTA_KEYSTORE_PASSWORD -file "$tmp/cert.der" || fail "Cannot open the configured signing key."
          keyfp=$(sha256sum "$tmp/cert.der" | cut -d' ' -f1)
          [[ "$keyfp" == "$expected" ]] || fail "Keystore certificate does not match the pinned certificate."
          echo "KEYSTORE_CERTIFICATE_MATCH"
          bt="$ANDROID_HOME/build-tools/37.0.0"
          "$bt/zipalign" -P 16 -f 4 output/DeltaVPN-unsigned.apk "$tmp/aligned.apk" || fail "APK alignment failed."
          echo "APK_ALIGNED"
          "$bt/apksigner" sign --ks "$tmp/delta.p12" --ks-type PKCS12 --ks-key-alias delta-release --ks-pass env:DELTA_KEYSTORE_PASSWORD --key-pass env:DELTA_KEYSTORE_PASSWORD --out output/DeltaVPN-1.7.7-arm64.apk "$tmp/aligned.apk" || fail "APK signing failed."
          unset DELTA_KEYSTORE_PASSWORD
          echo "APK_SIGNED"
          "$bt/apksigner" verify --verbose --print-certs output/DeltaVPN-1.7.7-arm64.apk > "$tmp/cert.txt" || fail "APK signature verification failed."
          cat "$tmp/cert.txt"
          # Require exactly one verified signer; accept legacy and scheme-specific certificate labels.
          actual=$(python3 - "$tmp/cert.txt" <<'PY'
          import re, sys
          data = open(sys.argv[1], encoding="utf-8").read()
          counts = re.findall(r'(?im)^\s*Number of signers:\s*(\d+)\s*$', data)
          if counts != ['1']:
              sys.exit('Expected exactly one APK signer')
          lines = [line for line in data.splitlines() if re.search(r'certificate\s+SHA-256\s+digest\s*:', line, re.I)]
          digests = set()
          for line in lines:
              row = re.fullmatch(r'\s*(?:Signer\s+#1\s*:?|V[23](?:\.\d+)?\s+Signer(?:\s+#1)?\s*:)\s+certificate\s+SHA-256\s+digest\s*:\s*([0-9a-f:]+)\s*', line, re.I)
              if not row:
                  sys.exit('Unexpected APK signer certificate format')
              digest = row[1].replace(':', '').lower()
              if not re.fullmatch(r'[0-9a-f]{64}', digest):
                  sys.exit('Invalid APK signer certificate digest')
              digests.add(digest)
          if len(digests) != 1:
              sys.exit('Expected exactly one distinct APK signer certificate digest')
          print(digests.pop())
          PY
          ) || fail "Unable to read exactly one verified signer."
          [[ "$actual" == "$expected" ]] || fail "Signed APK certificate differs from pinned certificate."
          echo "APK_CERTIFICATE_MATCH"
          "$bt/zipalign" -c -P 16 4 output/DeltaVPN-1.7.7-arm64.apk || fail "Signed APK alignment verification failed."
          echo "SIGNED_ALIGNMENT_OK"
          "$bt/aapt" dump badging output/DeltaVPN-1.7.7-arm64.apk > "$tmp/badging.txt" || fail "Unable to inspect APK manifest."
          python3 - "$tmp/badging.txt" <<'PY'
          import re, sys
          line = next((s for s in open(sys.argv[1], encoding="utf-8") if s.startswith("package:")), "")
          attrs = dict(re.findall(r"(\w+)='([^']*)'", line))
          # F-Droid ARM64 applies upstream split override: 5_000_000 + 100 * base + 1.
          # Keep this exact check; the previous 1.7.6 uses base 23 and this uses 24.
          expected_code = str(5_000_000 + 100 * 24 + 1)
          expected = {"name": "com.delta.vpn", "versionName": "1.7.7", "versionCode": expected_code}
          observed = {k: attrs.get(k) for k in expected}
          if observed != expected:
              sys.exit("Unexpected APK package/version: " + repr(observed) + "; expected " + repr(expected))
          print("APK_PACKAGE_VERSION_OK versionCode=" + expected_code)
          PY
          printf '%s\n' "$actual" > output/DeltaVPN-signing-cert.sha256
          (cd output && sha256sum DeltaVPN-1.7.7-arm64.apk > DeltaVPN-1.7.7-arm64.apk.sha256)
          echo "PERMANENT_SIGNATURE_VERIFIED"
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.7.7-arm64-release-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Delta VPN 1.7.7 ARM64 (signed test)" --notes "Release-mode APK signed with the pinned Delta certificate. Physical-device testing remains required." --draft
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" output/DeltaVPN-1.7.7-arm64.apk output/DeltaVPN-1.7.7-arm64.apk.sha256 output/DeltaVPN-signing-cert.sha256 output/DeltaVPN-source.tar.gz
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
